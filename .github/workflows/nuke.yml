name: Nuke build verification

# Local-build verification gate. Complements (does NOT replace) publish.yml:
#   - publish.yml stays small + npm-direct so trusted-publishing OIDC keeps working
#     unchanged.
#   - nuke.yml runs the IDomainConventionsApi pipeline end-to-end (`./build.sh Check`)
#     to guarantee restore -> lockstep -> compile -> no-manual-edits -> emit-all ->
#     determinism -> pack all pass on a clean checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read      # kept for a future GitHub Packages @ancplua/* dep; the emitters are workspace members and resolve locally

concurrency:
  group: nuke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # RestoreTypeSpecDeps is `bun install --frozen-lockfile` now, and the internal
      # @ancplua/* emitters are workspace members that resolve locally. The scope map
      # and token stay for Renovate and for any future GitHub Packages dependency
      # (e.g. @ancplua/typespec-otel-semconv); that would be the first one bun has to
      # authenticate, which this workflow has not yet exercised.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ancplua'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: build/global.json

      - name: Show toolchain
        run: |
          node --version
          npm --version
          bun --version
          dotnet --version

      - name: Run Nuke Check
        run: ./build.sh Check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # npm ci auth for GitHub Packages
