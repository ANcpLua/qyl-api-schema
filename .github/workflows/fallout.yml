name: Fallout build verification

# Full Fallout gate: `./build.sh Check` on a clean checkout, which is build/Build.cs's
# Check target: restore (bun install --frozen-lockfile) -> lint both TypeSpec surfaces
# (index.tsp and main.tsp, --warn-as-error) -> tracked generated/openapi matches a
# fresh emit -> route, fixture, Zod-parity and lint-rule invariants -> C# and TS
# emitters run twice and are byte-identical -> npm pack and NuGet pack -> both
# packages install into throwaway consumers (scripts/verify-packed.mjs).
# ci.yml is the fast bun-only lint/compile gate; publish.yml repeats the pack and
# consumer steps at release time and must stay small for npm trusted publishing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the full existing Check pipeline under the required review gate name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # node, bun and dotnet come from mise.toml. RestoreTypeSpecDeps is
      # `bun install --frozen-lockfile`; the @ancplua/* emitters are workspace members that
      # resolve locally, so nothing authenticates against GitHub Packages.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Show toolchain
        run: |
          node --version
          npm --version
          bun --version
          dotnet --version

      - name: Run Fallout Check
        run: ./build.sh Check
