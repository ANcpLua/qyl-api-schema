name: Fallout build verification

# Local-build verification gate. Complements (does NOT replace) publish.yml:
#   - publish.yml stays small + npm-direct so trusted-publishing OIDC keeps working
#     unchanged.
#   - fallout.yml runs the IDomainConventionsApi pipeline end-to-end (`./build.sh Check`)
#     to guarantee restore -> lockstep -> compile -> no-manual-edits -> emit-all ->
#     determinism -> pack all pass on a clean checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the full existing Check pipeline under the required review gate name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # node, bun and dotnet come from mise.toml. RestoreTypeSpecDeps is
      # `bun install --frozen-lockfile`; the @ancplua/* emitters are workspace members that
      # resolve locally, so nothing authenticates against GitHub Packages.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Show toolchain
        run: |
          node --version
          npm --version
          bun --version
          dotnet --version

      - name: Run Fallout Check
        run: ./build.sh Check
