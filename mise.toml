# The toolchain this repository builds with; `mise install` installs it.
# dotnet also keeps global.json, which dotnet itself reads.
[tools]
"bun" = "1.4.3"
"dotnet" = "10.0.401"
# bun installs and runs the scripts; node runs the TypeSpec compiler, the scripts/*.mjs gates
# and npm's version/pack/publish, so it must stay inside engines.node (>=22).
"node" = "24.21.0"

[tasks.check]
description = "The gate before a push or a release, in order"
run = [
  "bun install --frozen-lockfile",
  "bun run lint",
  "bun run lint:public",
  "bun run compile",
  "bun run lint:js",
  "./build.sh Check",
]
