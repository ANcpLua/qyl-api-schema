# The toolchain this repository builds with. CI installs it with jdx/mise-action;
# locally `mise install` does the same. dotnet also keeps global.json, which dotnet itself reads.
[tools]
"bun" = "1.4.2"
"dotnet" = "10.0.401"
# bun installs and runs the scripts; node runs the TypeSpec compiler, the scripts/*.mjs gates
# and npm's version/pack/publish, so it must stay inside engines.node (>=22).
"node" = "24"

[tasks.check]
description = "The gate: what CI runs, in order"
run = [
  "bun install --frozen-lockfile",
  "bun run lint",
  "bun run lint:public",
  "bun run compile",
  "bun run lint:js",
  "./build.sh Check",
]
